name: hidnr
options:
  bundleIdPrefix: com.rokib16x
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  hidnr:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: hidnr
        PRODUCT_BUNDLE_IDENTIFIER: com.rokib16x.hidnr
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bar/Private/hidnr-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_MODULE_NAME: hidnr
      configs:
        # Dev builds get their own name and app ID, so Spotlight, Finder and the
        # Accessibility list never mix them up with the installed release.
        Debug:
          PRODUCT_NAME: hidnr Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.rokib16x.hidnr.dev
