name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Dry run: nothing is published."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag that disagrees with the app's own version would ship a DMG whose
      # About screen names a different release.
      - name: Check version matches project.yml
        run: |
          want="${{ steps.tag.outputs.version }}"
          have="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)"
          [ "$want" = "$have" ] || { echo "::error::tag is $want but project.yml says $have"; exit 1; }

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Built unsigned, then signed once below, so exactly one signature (the
      # Developer ID one) ends up in the app.
      - name: Build (universal)
        run: |
          xcodebuild -project hidnr.xcodeproj -scheme hidnr -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build
          lipo -info build/Build/Products/Release/hidnr.app/Contents/MacOS/hidnr

      # The certificate lives in a throwaway keychain that exists only for this job.
      - name: Import the Developer ID certificate
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          printf '%s' "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"

          # The Developer ID intermediate isn't on the runner; without it codesign
          # can't build the chain. Pinned by fingerprint.
          ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          expected="F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"
          actual="$(/usr/bin/openssl x509 -inform DER -in "$ca" -noout -fingerprint -sha256 | tr -d ':' | cut -d= -f2)"
          [ "$actual" = "$expected" ] || { echo "::error::Developer ID CA fingerprint mismatch"; exit 1; }
          security import "$ca" -k "$keychain" -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          security find-identity -v | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application certificate missing"; exit 1; }

      - name: Sign the app
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/hidnr.app"
          # Hardened runtime is required for notarization. hidnr needs no
          # entitlements: Accessibility is a user permission, not an entitlement.
          codesign --force --sign "Developer ID Application" --options runtime --timestamp "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"

      - name: Build the DMG
        id: dmg
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          cp -R build/Build/Products/Release/hidnr.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "hidnr" -srcfolder "$stage" -ov -format UDZO "dist/hidnr-${version}.dmg"
          codesign --force --sign "Developer ID Application" --timestamp "dist/hidnr-${version}.dmg"
          echo "dmg=dist/hidnr-${version}.dmg" >> "$GITHUB_OUTPUT"

      # Notarizing the DMG also notarizes the app inside it; stapling the DMG
      # lets Gatekeeper accept it offline.
      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          dmg="${{ steps.dmg.outputs.dmg }}"
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          ( cd dist && shasum -a 256 "$(basename "$dmg")" | tee "$(basename "$dmg").sha256" )
          echo "SHA256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: hidnr-${{ steps.tag.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: steps.tag.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "hidnr ${{ steps.tag.outputs.tag }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.tag }}/CHANGELOG.md). Requires macOS 14 or later." \
            "${{ steps.dmg.outputs.dmg }}" "${{ steps.dmg.outputs.dmg }}.sha256"

      # This repo is its own tap, so the cask bump is a commit on main.
      - name: Point the cask at the new release
        if: steps.tag.outputs.dry_run == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          /usr/bin/sed -i '' \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 .*|  sha256 \"${SHA256}\"|" \
            Casks/hidnr.rb
          grep -q "\"${VERSION}\"" Casks/hidnr.rb && grep -q "${SHA256}" Casks/hidnr.rb
          ruby -c Casks/hidnr.rb
          if git diff --quiet Casks/hidnr.rb; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hidnr.rb
          git commit -m "build: point the cask at v${VERSION}"
          git push origin main
