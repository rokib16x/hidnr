name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          xcodebuild -project hidnr.xcodeproj -scheme hidnr -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
